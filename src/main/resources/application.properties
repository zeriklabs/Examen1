spring.application.name=examen

# Puerto asignado dinámicamente por Render (o 8080 por defecto)
server.port=${PORT:8080}

# Configuración de Base de Datos:
# Si se provee SPRING_DATASOURCE_URL (MySQL en la nube o local), se conecta a ella.
# Si no se provee, levanta en memoria con H2 en modo MySQL para que el despliegue en Render no falle.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:red_social;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
