spring.application.name=examen

# Puerto asignado dinámicamente por Render (o 8080 por defecto)
server.port=${PORT:8080}

# ========= BASE DE DATOS =========
# Sin variables de entorno → H2 en memoria (demo local)
# Con SPRING_DATASOURCE_URL → MySQL o PostgreSQL en la nube (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:red_social;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Hibernate — detecta el dialecto automáticamente según el driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
