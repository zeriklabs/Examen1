spring.application.name=examen

# Puerto asignado dinámicamente por Render (o 8080 por defecto)
server.port=${PORT:8080}

# ========= BASE DE DATOS =========
# Si defines DATABASE_URL en Render, se usa MySQL externo.
# Por defecto (sin variables), levanta con H2 en memoria para demostraciones.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:red_social;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
