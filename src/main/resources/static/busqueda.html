<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Usuarios | Noodle</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e4e6eb 100%);
            min-height: 100vh;
        }
        .navbar-brand {
            font-weight: 700;
            color: #1877f2 !important;
            letter-spacing: -0.5px;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
        }
        .search-box {
            position: relative;
        }
        .search-box .form-control {
            padding-left: 2.8rem;
            padding-right: 7rem;
            height: 3.5rem;
            border-radius: 2rem;
            font-size: 1.05rem;
            border: 2px solid #e4e6eb;
            transition: all 0.25s ease;
        }
        .search-box .form-control:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 0.25rem rgba(24, 119, 242, 0.15);
        }
        .search-box .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #65676b;
            font-size: 1.25rem;
        }
        .search-box .btn-search {
            position: absolute;
            right: 0.4rem;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 1.75rem;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            background-color: #1877f2;
            border: none;
            color: white;
            transition: all 0.2s ease;
        }
        .search-box .btn-search:hover {
            background-color: #166fe5;
        }
        .user-result-card {
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
        }
        .user-result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            border-color: #cbd5e1;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1877f2 0%, #00c6ff 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .badge-username {
            background-color: #e7f3ff;
            color: #1877f2;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-4" href="/busqueda.html">
                <i class="bi bi-people-fill me-2"></i>Noodle
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-secondary" href="/registro.html">
                            <i class="bi bi-person-plus me-1"></i> Registro
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold text-primary" href="/busqueda.html">
                            <i class="bi bi-search me-1"></i> Buscador de Usuarios
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card card-custom p-4 p-md-5 mb-4">
                    <div class="text-center mb-4">
                        <div class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill mb-2 fw-semibold">
                            <i class="bi bi-search me-1"></i> Funcionalidad 2
                        </div>
                        <h2 class="fw-bold text-dark">BUSCAR PERSONAS</h2>
                        <p class="text-muted">Busca personas por nombre, apellidos o nombre de usuario</p>
                    </div>

                    <!-- Buscador AJAX -->
                    <form id="busquedaForm" class="mb-3" onsubmit="return false;">
                        <div class="search-box">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="inputBusqueda" class="form-control" 
                                   placeholder="Escribe al menos 3 caracteres (ej. juan)..." 
                                   autocomplete="off">
                            <button type="submit" id="btnBuscar" class="btn-search">
                                <span id="spinnerBuscar" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
                                BUSCAR
                            </button>
                        </div>
                        <div class="form-text text-center mt-2 text-muted">
                            <i class="bi bi-info-circle me-1"></i>El sistema requiere un mínimo de 3 caracteres para iniciar la búsqueda.
                        </div>
                    </form>

                    <!-- Mensajes de Alerta -->
                    <div id="alertContainer" class="mt-3"></div>
                </div>

                <!-- Contenedor de Resultados -->
                <div id="resultadosCard" class="card card-custom p-4 p-md-4 d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                        <h5 class="fw-bold mb-0 text-dark">
                            <i class="bi bi-card-list me-2 text-primary"></i>Resultados encontrados:
                        </h5>
                        <span id="badgeContador" class="badge bg-secondary rounded-pill">0 personas</span>
                    </div>

                    <!-- Lista dinámica de usuarios -->
                    <div id="listaResultados" class="d-flex flex-column gap-3"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script AJAX / Fetch -->
    <script>
        const busquedaForm = document.getElementById('busquedaForm');
        const inputBusqueda = document.getElementById('inputBusqueda');
        const btnBuscar = document.getElementById('btnBuscar');
        const spinnerBuscar = document.getElementById('spinnerBuscar');
        const alertContainer = document.getElementById('alertContainer');
        const resultadosCard = document.getElementById('resultadosCard');
        const listaResultados = document.getElementById('listaResultados');
        const badgeContador = document.getElementById('badgeContador');

        function mostrarAlerta(mensaje, tipo = 'warning') {
            const icono = tipo === 'warning' ? 'bi-exclamation-circle-fill' : (tipo === 'danger' ? 'bi-x-circle-fill' : 'bi-info-circle-fill');
            alertContainer.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show d-flex align-items-center" role="alert">
                    <i class="bi ${icono} fs-4 me-3"></i>
                    <div>${mensaje}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        function limpiarAlertas() {
            alertContainer.innerHTML = '';
        }

        async function realizarBusqueda() {
            limpiarAlertas();
            const texto = inputBusqueda.value.trim();

            // Validación en el Frontend: mínimo 3 caracteres
            if (texto.length < 3) {
                mostrarAlerta('La búsqueda debe contener al menos 3 caracteres.', 'warning');
                resultadosCard.classList.add('d-none');
                listaResultados.innerHTML = '';
                return;
            }

            // Animación de carga
            btnBuscar.disabled = true;
            spinnerBuscar.classList.remove('d-none');

            try {
                // Endpoint: GET /api/v1/usuarios/buscar?texto=...
                const response = await fetch(`/api/v1/usuarios/buscar?texto=${encodeURIComponent(texto)}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    // Manejo del error retornado por el backend (ej. 400 Bad Request)
                    const mensajeError = data && data.mensaje ? data.mensaje : 'Error al realizar la búsqueda.';
                    mostrarAlerta(mensajeError, 'danger');
                    resultadosCard.classList.add('d-none');
                    listaResultados.innerHTML = '';
                    return;
                }

                // Renderizar resultados encontrados
                const usuarios = Array.isArray(data) ? data : [];
                badgeContador.textContent = `${usuarios.length} persona${usuarios.length === 1 ? '' : 's'}`;

                if (usuarios.length === 0) {
                    resultadosCard.classList.remove('d-none');
                    listaResultados.innerHTML = `
                        <div class="text-center py-4 text-muted">
                            <i class="bi bi-emoji-neutral fs-1 mb-2"></i>
                            <p class="mb-0">No se encontraron usuarios que coincidan con "<strong>${texto}</strong>".</p>
                        </div>
                    `;
                } else {
                    resultadosCard.classList.remove('d-none');
                    listaResultados.innerHTML = usuarios.map(u => {
                        const inicial = (u.nombre && u.nombre.length > 0) ? u.nombre.charAt(0).toUpperCase() : 'U';
                        const nombreCompleto = `${u.nombre} ${u.apellidoPaterno} ${u.apellidoMaterno}`;
                        return `
                            <div class="user-result-card p-3 d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="user-avatar">${inicial}</div>
                                    <div>
                                        <h6 class="fw-bold mb-0 text-dark">${nombreCompleto}</h6>
                                        <span class="badge badge-username mt-1">@${u.usuario}</span>
                                    </div>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="alert('Perfil de @${u.usuario}')">
                                        <i class="bi bi-person-fill"></i> Ver perfil
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

            } catch (error) {
                mostrarAlerta('No se pudo conectar con el servidor. Verifica que Spring Boot esté activo.', 'danger');
                resultadosCard.classList.add('d-none');
            } finally {
                btnBuscar.disabled = false;
                spinnerBuscar.classList.add('d-none');
            }
        }

        busquedaForm.addEventListener('submit', realizarBusqueda);

        // Búsqueda al presionar Enter en el input
        inputBusqueda.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                realizarBusqueda();
            }
        });
    </script>
</body>
</html>
